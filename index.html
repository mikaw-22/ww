<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=lock,lock_open_right,upload,check_circle" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="assets/media/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Wölfe Würzburg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Login</title>
</head>
<body>

    <style>
        .main-container {
            width: 10cm;
            margin: 0 auto; /* zentriert horizontal auf der Seite */
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #00000028;
            padding: 20px;
            border-radius: 10px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            margin: 0;
            width: 100%;
        }

        input {
            outline: none;
            width: 220px;
            height: 30px;
            background-color: #6580b04b;
            color: white;
            border: 1px solid #ffffff3b;
            padding: 0 5px;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #6580b04b inset !important;
            -webkit-text-fill-color: white !important;
            caret-color: white;
            transition: background-color 5000s ease-in-out 0s;
            border: 1px solid #ffffff3b !important;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <h1>
        <span class="h1_left">
            <span id="live_clock"></span>&nbsp;&nbsp;-&nbsp;&nbsp;Bitte melden Sie sich an
        </span>
        <span class="h1_title">Anmelden</span>
    </h1>

    <div class="main-container">
        <div class="container">
            <div class="row">
                <label for="login_email">E-Mail:</label>
                <input type="text" id="login_email">
            </div>
            <div class="row">
                <label for="login_password">Passwort:</label>
                <input type="password" id="login_password">
            </div>
            <button id="login_btn">Login</button>
            <p id="login_error" style="color: red; display: none;"></p>
        </div>
    </div>

    <script src="assets/js/login.js"></script>
</body>
</html>
